<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressão de Pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#F2EFE8;--card:#FDFAF5;--icon:#EDE8DF;
  --navy:#1A2B4A;--navy-d:#0F1D33;--gold:#B8864A;
  --gold-b:rgba(184,134,74,.2);--gold-l:rgba(184,134,74,.1);
  --div:#C8B99A;--muted:#5A544E;
  --green:#2E7D52;--green-l:#E4EDE4;
  --red:#B03A2E;--red-l:#FDECEA;
}
html,body{min-height:100%;background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;font-size:14px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{padding:20px 24px 60px;display:flex;flex-direction:column;gap:16px;max-width:900px;margin:0 auto;}
.sec{background:var(--card);border:0.5px solid var(--gold-b);border-radius:16px;padding:20px 22px;animation:fadeUp .35s ease both;}
h1{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:var(--navy);margin-bottom:4px;}
.sub{font-size:12px;color:var(--muted);margin-bottom:4px;}
.nav-modulos{font-size:11px;margin-bottom:2px;}
.nav-modulos a{color:var(--navy);font-weight:600;text-decoration:none;border-bottom:1px dashed var(--gold);}
.grid2{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;align-items:start;margin-top:16px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}
textarea{width:100%;min-height:140px;border:1.5px solid var(--gold-b);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;background:#fff;color:var(--navy);outline:none;resize:vertical;}
textarea:focus{border-color:var(--gold);}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px;}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;}
label.fld select{height:38px;border:1.5px solid var(--gold-b);border-radius:8px;padding:0 12px;font-size:13px;background:#fff;font-family:inherit;outline:none;color:var(--navy);width:100%;}
label.fld select:focus{border-color:var(--gold);}
.btn-primary{padding:0 22px;height:38px;border:none;border-radius:9px;background:var(--navy);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s;}
.btn-primary:hover{background:var(--navy-d);}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
.erro{background:var(--red-l);color:var(--red);border:0.5px solid rgba(176,58,46,.3);border-radius:8px;padding:10px 14px;font-size:12px;margin-top:14px;display:none;}
.resumo-busca{font-size:11px;color:var(--muted);margin-top:10px;display:none;}

/* Folhas de impressão dos pedidos */
.folhas{display:none;flex-direction:column;gap:16px;}
.folhas.mostrar{display:flex;}
.folha{background:#fff;border:0.5px solid var(--gold-b);border-radius:12px;padding:28px 32px;}
.folha.erro-pedido{border-color:rgba(176,58,46,.4);}
.folha.erro-pedido .msg-erro{color:var(--red);font-size:13px;}
.folha-cab{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px;}
.folha-cab h2{font-family:'Playfair Display',serif;font-style:italic;font-size:19px;color:var(--navy);}
.folha-cab .empresa{font-size:12px;color:var(--muted);margin-top:2px;}
.folha-cab .pednum{text-align:right;}
.folha-cab .pednum .num{font-size:22px;font-weight:700;color:var(--navy);font-family:ui-monospace,Menlo,monospace;}
.folha-cab .pednum .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.grid-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;margin-bottom:16px;}
.info-item .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px;}
.info-item .val{font-size:13px;color:var(--navy);font-weight:600;}
table.itens{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;}
table.itens th{background:var(--navy);color:#fff;padding:7px 9px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
table.itens td{padding:7px 9px;border-bottom:0.5px solid var(--gold-l);}
table.itens td.r{text-align:right;font-variant-numeric:tabular-nums;}
table.itens tfoot td{border-top:2px solid var(--navy);border-bottom:none;font-weight:700;padding-top:9px;}
.obs-box{background:var(--cream);border:0.5px solid var(--gold-b);border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:10px;white-space:pre-wrap;}
.obs-box .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;font-weight:700;}
.folha-rodape{margin-top:18px;padding-top:10px;border-top:0.5px dashed var(--gold-b);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;}
.acoes-finais{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

@media print{
  body *{visibility:hidden;}
  .folhas, .folhas *{visibility:visible;}
  .folhas{position:absolute;top:0;left:0;width:100%;}
  .folha{border:none;border-radius:0;padding:0 12mm;page-break-after:always;}
  .folha:last-child{page-break-after:auto;}
  .wrap{padding:0;max-width:none;}
  .sec:not(.folhas-container){display:none;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="sec">
    <div class="nav-modulos"><a href="/nf-boleto.html">← Nota Fiscal + Boletos</a></div>
    <h1>Impressão de Pedido</h1>
    <p class="sub">Selecione a empresa, informe um ou mais números de pedido (um por linha) e imprima os pedidos completos (itens, quantidades, valores e cliente), direto do Omie.</p>

    <div class="grid2">
      <div>
        <label class="fld">Empresa
          <select id="f-empresa">
            <option value="MFP">MF Paris</option>
            <option value="DMS">DMS Alimentos</option>
            <option value="PRF">Profi Comércio</option>
          </select>
        </label>
        <label class="fld">Número(s) do pedido
          <textarea id="f-numeros" spellcheck="false" placeholder="12345&#10;12346&#10;12347"></textarea>
        </label>
        <div class="hint">Um número de pedido por linha. Pode colar direto de uma coluna do Excel.</div>
      </div>
      <div>
        <button class="btn-primary" id="btn-buscar">Buscar pedido(s)</button>
        <div class="resumo-busca" id="resumo-busca"></div>
      </div>
    </div>

    <div class="erro" id="erro"></div>
  </div>

  <div class="sec folhas-container">
    <div class="folhas" id="folhas"></div>
  </div>

  <div class="acoes-finais" id="acoes-finais" style="display:none;">
    <button class="btn-primary" id="btn-imprimir">Imprimir pedido(s)</button>
  </div>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   1. CONFIG — key/secret NÃO ficam aqui: /api/omie-seguro resolve no
   servidor a partir do código da empresa (mesmo padrão de nf-boleto.html).
   ══════════════════════════════════════════════════════════════════════════ */
const EMPRESAS = {
  MFP: { nome: 'MF Paris' },
  DMS: { nome: 'DMS Alimentos' },
  PRF: { nome: 'Profi Comércio' },
};
const EP_PEDIDO = 'https://app.omie.com.br/api/v1/produtos/pedido/';
const EP_CLIENTE = 'https://app.omie.com.br/api/v1/geral/clientes/';
const FRETE_LABEL = { '1': 'CIF (remetente)', '2': 'FOB (destinatário)', '3': 'Terceiros', '4': 'Próprio (remetente)', '5': 'Próprio (destinatário)', '6': 'Sem transporte' };
const ETAPA_LABEL = { '10': 'Em digitação', '20': 'Em análise', '30': 'Aprovado (parcial)', '40': 'Aprovado (produção)', '50': 'Aprovado', '60': 'Faturado' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function erro(msg) {
  const el = $('erro');
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg; el.style.display = 'block';
}
function fmtMoeda(v) {
  return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtData(d) {
  if (!d) return '—';
  const m = String(d).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m) return d;
  const dt = new Date(d);
  return isNaN(dt.getTime()) ? d : dt.toLocaleDateString('pt-BR');
}
function parseNumeros(txt) {
  const vistos = new Set();
  return String(txt).split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.replace(/\D/g, '')).filter(Boolean)
    .filter(n => { if (vistos.has(n)) return false; vistos.add(n); return true; });
}

/* ══════════════════════════════════════════════════════════════════════════
   2. OMIE — mesmo padrão de nf-boleto.html
   ══════════════════════════════════════════════════════════════════════════ */
async function omieCall(endpoint, call, empCod, param, tentativa) {
  const resp = await fetch('/api/omie-seguro', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ endpoint, call, param, empresa: empCod })
  });
  const data = await resp.json().catch(() => ({}));
  if (data && data.faultstring) {
    if (/REDUNDANT|CONSUMO|Aguarde/i.test(data.faultstring) && !tentativa) {
      const m = data.faultstring.match(/(\d+)\s*segundo/i);
      const seg = m ? (parseInt(m[1], 10) + 3) : 35;
      await sleep(seg * 1000);
      return omieCall(endpoint, call, empCod, param, true);
    }
    const err = new Error(data.faultstring);
    err.omie = true;
    throw err;
  }
  return data;
}

async function acharPedidoCompleto(numeroPedido, empCod) {
  const soDigitos = String(numeroPedido || '').replace(/\D/g, '');
  const n = parseInt(soDigitos, 10) || 0;
  if (!n) return null;
  const data = await omieCall(EP_PEDIDO, 'ListarPedidos', empCod, [{
    pagina: 1, registros_por_pagina: 20,
    numero_pedido_de: n, numero_pedido_ate: n,
    apenas_importado_api: 'N'
  }]);
  const lista = (data && data.pedido_venda_produto) || [];
  const alvo = String(numeroPedido).trim();
  return lista.find(p => {
    const np = String((p.cabecalho || {}).numero_pedido || '').trim();
    if (np === alvo) return true;
    const npDigitos = np.replace(/\D/g, '');
    return npDigitos && (parseInt(npDigitos, 10) === n);
  }) || null;
}

async function consultarCliente(codigoCliente, empCod) {
  if (!codigoCliente) return null;
  try {
    return await omieCall(EP_CLIENTE, 'ConsultarCliente', empCod, [{ codigo_cliente_omie: parseInt(codigoCliente, 10) }]);
  } catch (e) { return null; }
}

/* ══════════════════════════════════════════════════════════════════════════
   3. FLUXO PRINCIPAL
   ══════════════════════════════════════════════════════════════════════════ */
let rodando = false;

async function buscar() {
  if (rodando) return;
  const empCod = $('f-empresa').value;
  const numeros = parseNumeros($('f-numeros').value);
  if (!numeros.length) { erro('Informe ao menos um número de pedido.'); return; }

  rodando = true;
  erro('');
  $('folhas').innerHTML = '';
  $('folhas').classList.remove('mostrar');
  $('acoes-finais').style.display = 'none';
  $('resumo-busca').style.display = 'none';
  $('btn-buscar').disabled = true;
  $('btn-buscar').innerHTML = '<span class="spin"></span> Buscando…';

  const resultados = [];

  try {
    for (let i = 0; i < numeros.length; i++) {
      const numero = numeros[i];
      try {
        const p = await acharPedidoCompleto(numero, empCod);
        if (!p) {
          resultados.push({ ok: false, numero, mensagem: 'Pedido ' + numero + ' não encontrado em ' + EMPRESAS[empCod].nome + '.' });
        } else {
          const cab = p.cabecalho || {};
          const cliente = await consultarCliente(cab.codigo_cliente, empCod);
          await sleep(300);

          const itens = (p.det || []).map(d => ({
            sku: (d.produto || {}).codigo || '',
            descricao: (d.produto || {}).descricao || '',
            quantidade: (d.produto || {}).quantidade || 0,
            valorUnit: (d.produto || {}).valor_unitario || 0,
            valorTotal: (d.produto || {}).valor_total || 0,
            pesoLiquido: (d.inf_adic || {}).peso_liquido || 0
          })).filter(it => it.sku);

          resultados.push({
            ok: true,
            empresaNome: EMPRESAS[empCod].nome,
            numeroPedido: cab.numero_pedido || numero,
            cliente,
            vendedorCodigo: cab.codigo_vendedor,
            dataInclusao: (p.infoCadastro || {}).dInc || '',
            frete: FRETE_LABEL[String((p.frete || {}).modalidade)] || (p.frete || {}).modalidade || '—',
            etapa: ETAPA_LABEL[String(cab.etapa)] || cab.etapa || '—',
            itens,
            valorTotal: (p.total_pedido || {}).valor_total_pedido || itens.reduce((s, it) => s + it.valorTotal, 0),
            observacoes: (p.observacoes || {}).obs_venda || '',
            dadosNF: (p.informacoes_adicionais || {}).dados_adicionais_nf || ''
          });
        }
      } catch (e) {
        resultados.push({ ok: false, numero, mensagem: 'Erro ao buscar pedido ' + numero + ': ' + (e.message || e) });
      }
      await sleep(300);
    }

    renderFolhas(resultados);

    const ok = resultados.filter(r => r.ok).length;
    $('resumo-busca').textContent = ok + ' de ' + numeros.length + ' pedido(s) encontrado(s).';
    $('resumo-busca').style.display = 'block';
  } finally {
    rodando = false;
    $('btn-buscar').disabled = false;
    $('btn-buscar').textContent = 'Buscar pedido(s)';
  }
}

function renderFolhas(resultados) {
  const el = $('folhas');
  el.innerHTML = resultados.map(r => r.ok ? folhaHtml(r) : folhaErroHtml(r)).join('');
  el.classList.add('mostrar');
  $('acoes-finais').style.display = resultados.some(r => r.ok) ? 'flex' : 'none';
}

function folhaErroHtml(r) {
  return '<div class="folha erro-pedido">' +
    '<div class="msg-erro">' + esc(r.mensagem) + '</div>' +
  '</div>';
}

function folhaHtml(info) {
  const cli = info.cliente || {};
  const clienteNome = cli.razao_social || cli.nome_fantasia || 'Cliente não localizado no Omie';
  const clienteDoc = cli.cnpj_cpf || '—';
  const clienteCidade = [cli.cidade, cli.estado].filter(Boolean).join(' / ') || '—';
  const clienteEndereco = [cli.endereco, cli.endereco_numero, cli.bairro].filter(Boolean).join(', ') || '—';
  const vendedor = info.vendedorCodigo ? ('Cód. ' + info.vendedorCodigo) : '—';
  const pesoTotal = info.itens.reduce((s, it) => s + (it.pesoLiquido * it.quantidade), 0);
  const pesoTxt = pesoTotal ? pesoTotal.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' kg' : '—';

  const itensHtml = info.itens.map(it =>
    '<tr><td>' + esc(it.sku || '—') + '</td><td>' + esc(it.descricao || '—') + '</td>' +
    '<td class="r">' + it.quantidade + '</td>' +
    '<td class="r">' + fmtMoeda(it.valorUnit) + '</td>' +
    '<td class="r">' + fmtMoeda(it.valorTotal) + '</td></tr>'
  ).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">Nenhum item encontrado</td></tr>';

  return '<div class="folha">' +
    '<div class="folha-cab">' +
      '<div><h2>Pedido de Venda</h2><div class="empresa">' + esc(info.empresaNome) + '</div></div>' +
      '<div class="pednum"><div class="lbl">Nº do pedido</div><div class="num">' + esc(info.numeroPedido) + '</div></div>' +
    '</div>' +
    '<div class="grid-info">' +
      '<div class="info-item"><div class="lbl">Cliente</div><div class="val">' + esc(clienteNome) + '</div></div>' +
      '<div class="info-item"><div class="lbl">CNPJ/CPF</div><div class="val">' + esc(clienteDoc) + '</div></div>' +
      '<div class="info-item"><div class="lbl">Cidade/UF</div><div class="val">' + esc(clienteCidade) + '</div></div>' +
      '<div class="info-item"><div class="lbl">Endereço</div><div class="val">' + esc(clienteEndereco) + '</div></div>' +
      '<div class="info-item"><div class="lbl">Vendedor</div><div class="val">' + esc(vendedor) + '</div></div>' +
      '<div class="info-item"><div class="lbl">Data de inclusão</div><div class="val">' + esc(fmtData(info.dataInclusao)) + '</div></div>' +
      '<div class="info-item"><div class="lbl">Frete</div><div class="val">' + esc(info.frete) + '</div></div>' +
      '<div class="info-item"><div class="lbl">Etapa</div><div class="val">' + esc(info.etapa) + '</div></div>' +
      '<div class="info-item"><div class="lbl">Peso total (estimado)</div><div class="val">' + esc(pesoTxt) + '</div></div>' +
    '</div>' +
    '<table class="itens">' +
      '<thead><tr><th>SKU</th><th>Descrição</th><th style="text-align:right">Qtd</th><th style="text-align:right">Vlr Unit.</th><th style="text-align:right">Vlr Total</th></tr></thead>' +
      '<tbody>' + itensHtml + '</tbody>' +
      '<tfoot><tr><td colspan="4">TOTAL DO PEDIDO</td><td class="r">' + fmtMoeda(info.valorTotal) + '</td></tr></tfoot>' +
    '</table>' +
    (info.observacoes ? '<div class="obs-box"><div class="lbl">Observações</div><div>' + esc(info.observacoes) + '</div></div>' : '') +
    (info.dadosNF ? '<div class="obs-box"><div class="lbl">Dados adicionais para a Nota Fiscal</div><div>' + esc(info.dadosNF) + '</div></div>' : '') +
    '<div class="folha-rodape"><span>' + esc(info.empresaNome) + ' — Pedido de Venda</span><span>Impresso em ' + new Date().toLocaleString('pt-BR') + '</span></div>' +
  '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   4. EVENTOS
   ══════════════════════════════════════════════════════════════════════════ */
$('btn-buscar').addEventListener('click', buscar);
$('btn-imprimir').addEventListener('click', () => window.print());
</script>
</body>
</html>
